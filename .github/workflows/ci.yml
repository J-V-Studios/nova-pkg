name: CI
on:
  push:
  pull_request:

jobs:
  # Fast checks: formatting, vet, build, unit tests (mocked backends)
  unit:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm go git base-devel pacman-contrib sudo

      - uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        # -race: catch data races in parallel search
        # -count=1: never pass on cached results
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Real pacman + AUR (makepkg) tests
  arch-integration:
    runs-on: ubuntu-latest
    needs: unit
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm go git base-devel pacman-contrib sudo

      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Integration tests (pacman + AUR)
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && go test -count=1 -tags integration,pacman,aur ./..."

  # Real Flatpak tests
  flatpak-integration:
    runs-on: ubuntu-latest
    needs: unit
    container:
      image: archlinux:latest
      options: --privileged   # flatpak needs namespaces/bwrap
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm go git flatpak

      - uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add Flathub
        run: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Integration tests (Flatpak)
        run: go test -count=1 -tags integration,flatpak ./...

  # Real Snap tests (needs systemd/snapd, so use the native Ubuntu runner)
  snap-integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests (Snap)
        run: go test -count=1 -tags integration,snap ./...